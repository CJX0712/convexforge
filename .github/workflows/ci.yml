name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Self-test (10 invariant gates)
        run: python -m convexforge.cli selftest

      - name: Unit tests
        run: pytest -q

      - name: Demo (CPU, <= 60 s budget)
        run: python -m convexforge.cli run

      - name: Upload benchmark artifact
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
          if-no-files-found: warn
